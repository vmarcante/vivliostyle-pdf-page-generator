services:
  api:
    build:
      context: ../..          # raiz do projeto
      dockerfile: docker/prod/Dockerfile
    ports:
      - "8000:8000"
    environment:
      VIVLIO_TIMEOUT: "120"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
