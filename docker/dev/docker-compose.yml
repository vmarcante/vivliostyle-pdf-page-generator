services:
  api:
    build:
      context: ../..          # raiz do projeto
      dockerfile: docker/dev/Dockerfile
    ports:
      - "8000:8000"
    environment:
      VIVLIO_TIMEOUT: "120"
    volumes:
      - ../../app:/app/app                   # código-fonte → hot-reload
      - ../../logging.ini:/app/logging.ini
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tests:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    volumes:
      - ../../app:/app/app
      - ../../tests:/app/tests
      - ../../pyproject.toml:/app/pyproject.toml
    command: python3 -m pytest -vv --cov=app --cov-report=term-missing
    profiles:
      - test
