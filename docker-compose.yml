# Atalho para subir o servidor rapidamente usando a imagem raiz.
# Para ambientes dedicados, prefira:
#   docker/dev/docker-compose.yml  → desenvolvimento (hot-reload)
#   docker/prod/docker-compose.yml → produção (restart: always)

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_MODE: serve
      VIVLIO_TIMEOUT: "120"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tests:
    build: .
    environment:
      APP_MODE: test
    profiles:
      - test
