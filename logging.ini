[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=console

[formatters]
keys=default,access

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=console
propagate=0
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=console
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=console
propagate=0
qualname=uvicorn.access

[handler_console]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stdout,)

[formatter_default]
format=%(asctime)s - %(levelname)s - %(name)s - %(message)s

datefmt=%Y-%m-%dT%H:%M:%S%z

[formatter_access]
format=%(asctime)s - %(levelname)s - %(client_addr)s - "%(request_line)s" %(status_code)s

datefmt=%Y-%m-%dT%H:%M:%S%z
